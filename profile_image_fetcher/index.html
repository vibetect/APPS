<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Image Fetcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f0f0;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      color: #111;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
    }

    /* Form fields */
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 9px;
      color: #111;
      font-size: 0.93rem;
      padding: 11px 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #999;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
    }

    input::placeholder { color: #ccc; }

    #profile-input { margin-bottom: 20px; }

    /* Size picker */
    .size-label { margin-bottom: 8px; }

    .size-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .size-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      background: #fafafa;
      color: #888;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .size-btn:hover { border-color: #bbb; color: #333; background: #f5f5f5; }

    .size-btn.active {
      background: #111;
      border-color: #111;
      color: #fff;
      font-weight: 600;
    }

    /* Fetch button */
    #fetch-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #111;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    #fetch-btn:hover { opacity: 0.85; }
    #fetch-btn:active { transform: scale(0.98); }
    #fetch-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Error */
    #error-msg {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-radius: 9px;
      color: #b91c1c;
      font-size: 0.83rem;
      line-height: 1.6;
    }

    #error-msg a { color: #b91c1c; }

    /* Result */
    #result {
      margin-top: 28px;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin-bottom: 24px;
    }

    .preview-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #preview-img {
      border-radius: 50%;
      border: 3px solid #e8e8e8;
      width: 130px;
      height: 130px;
      object-fit: cover;
      background: #f5f5f5;
    }

    .username-label {
      font-size: 1rem;
      font-weight: 700;
      color: #111;
    }

    .meta {
      font-size: 0.78rem;
      color: #aaa;
      text-align: center;
      line-height: 1.7;
    }

    .meta a {
      color: #888;
      text-decoration: none;
      word-break: break-all;
    }

    .meta a:hover { text-decoration: underline; }

    .actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 10px 0;
      border-radius: 9px;
      border: 1px solid #e0e0e0;
      background: #fff;
      color: #333;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .btn-action:hover { border-color: #bbb; background: #fafafa; color: #111; }

    #download-note {
      display: none;
      font-size: 0.75rem;
      color: #aaa;
      text-align: center;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Profile Image Fetcher</h1>
    <p class="subtitle">Fetch X.com profile pictures — no API key required</p>

    <label for="profile-input">Username or URL</label>
    <input type="text" id="profile-input"
           placeholder="e.g. lunarcrush or https://x.com/lunarcrush"
           autocomplete="off" spellcheck="false" />

    <label class="size-label">Image Size</label>
    <div class="size-row">
      <button class="size-btn" data-size="100">100px</button>
      <button class="size-btn active" data-size="200">200px</button>
      <button class="size-btn" data-size="400">400px</button>
      <button class="size-btn" data-size="800">800px</button>
    </div>

    <button id="fetch-btn">Fetch Image</button>

    <div id="error-msg"></div>

    <div id="result">
      <hr class="divider" />
      <div class="preview-wrap">
        <img id="preview-img" src="" alt="Profile picture" crossorigin="anonymous" />
        <div class="username-label" id="username-label"></div>
        <div class="meta" id="meta-info"></div>
        <div class="actions">
          <button class="btn-action" id="copy-img-btn">Copy Image</button>
          <button class="btn-action" id="download-btn">Download</button>
        </div>
        <div id="download-note">
          Image opened in a new tab — right-click it and choose <strong>Save Image As</strong>.
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIG ---
    const UNAVATAR_BASE = 'https://unavatar.io/x';

    // --- STATE ---
    let selectedSize = 200;
    let currentAvatarUrl = '';
    let currentUsername = '';

    // --- USERNAME PARSING ---
    function parseUsername(input) {
      const m = input.match(/(?:x\.com|twitter\.com)\/([A-Za-z0-9_]+)/);
      if (m) return m[1];
      return input.replace(/^@/, '').trim();
    }

    // --- AVATAR FETCH (unavatar.io) ---
    async function fetchAvatarUrl(username) {
      const url = `${UNAVATAR_BASE}/${encodeURIComponent(username)}?json`;
      let resp;
      try {
        resp = await fetch(url);
      } catch (err) {
        throw new Error('Network error — check your internet connection.');
      }
      if (resp.status === 404) throw new Error(`Profile <strong>@${username}</strong> was not found.`);
      if (!resp.ok) throw new Error(`Could not fetch profile (HTTP ${resp.status}).`);
      const data = await resp.json();
      return data.url || null;
    }

    // --- SIZE VARIANT ---
    // Twitter CDN URLs contain "_normal" — swap it for a larger size variant.
    const SIZE_SUFFIX = { 100: '_bigger', 200: '_200x200', 400: '_400x400', 800: '_400x400' };
    function applySize(url, size) {
      if (url.includes('pbs.twimg.com') && url.includes('_normal')) {
        return url.replace('_normal', SIZE_SUFFIX[size] ?? '_400x400');
      }
      return url; // non-Twitter CDN: return as-is
    }

    // --- UI HELPERS ---
    function setLoading(on) {
      const btn = document.getElementById('fetch-btn');
      btn.disabled = on;
      btn.innerHTML = on ? '<span class="spinner"></span>Fetching…' : 'Fetch Image';
    }

    function showError(html) {
      const el = document.getElementById('error-msg');
      el.innerHTML = html;
      el.style.display = 'block';
    }

    function clearError() {
      const el = document.getElementById('error-msg');
      el.innerHTML = '';
      el.style.display = 'none';
    }

    function hideResult() { document.getElementById('result').style.display = 'none'; }

    function showResult(username, avatarUrl) {
      currentAvatarUrl = avatarUrl;
      currentUsername = username;
      document.getElementById('preview-img').src = avatarUrl;
      document.getElementById('username-label').textContent = `@${username}`;
      const shortUrl = avatarUrl.replace(/^https?:\/\//, '');
      document.getElementById('meta-info').innerHTML =
        `${selectedSize}px &middot; <a href="${avatarUrl}" target="_blank" title="${avatarUrl}">${shortUrl.length > 50 ? shortUrl.slice(0, 47) + '…' : shortUrl}</a>`;
      document.getElementById('download-note').style.display = 'none';
      document.getElementById('result').style.display = 'block';
    }

    // --- MAIN FETCH ---
    async function doFetch() {
      const raw = document.getElementById('profile-input').value.trim();
      if (!raw) return;
      const username = parseUsername(raw);
      if (!username) { showError('Could not parse a username from the input.'); return; }

      clearError();
      hideResult();
      setLoading(true);

      let baseUrl;
      try {
        baseUrl = await fetchAvatarUrl(username);
      } catch (err) {
        showError(err.message);
        setLoading(false);
        return;
      }

      if (!baseUrl) {
        showError('Could not determine the avatar URL.');
        setLoading(false);
        return;
      }

      showResult(username, applySize(baseUrl, selectedSize));
      setLoading(false);
    }

    // --- COPY IMAGE ---
    async function copyImage() {
      const btn = document.getElementById('copy-img-btn');
      if (typeof ClipboardItem !== 'undefined') {
        try {
          const resp = await fetch(currentAvatarUrl);
          const blob = await resp.blob();
          await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy Image', 1500);
          return;
        } catch (_) { /* fall through */ }
      }
      try {
        await navigator.clipboard.writeText(currentAvatarUrl);
        btn.textContent = 'URL copied!';
        setTimeout(() => btn.textContent = 'Copy Image', 1500);
      } catch (_) {
        btn.textContent = 'Failed';
        setTimeout(() => btn.textContent = 'Copy Image', 1500);
      }
    }

    // --- DOWNLOAD ---
    async function downloadImage() {
      const filename = `${currentUsername}_profile.png`;
      try {
        const resp = await fetch(currentAvatarUrl);
        if (!resp.ok) throw new Error('fetch failed');
        const blob = await resp.blob();
        if ('showSaveFilePicker' in window) {
          try {
            const handle = await window.showSaveFilePicker({ suggestedName: filename });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            return;
          } catch (e) {
            if (e.name === 'AbortError') return;
          }
        }
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 60_000);
        return;
      } catch (_) { /* fall through */ }
      window.open(currentAvatarUrl, '_blank');
      document.getElementById('download-note').style.display = 'block';
    }

    // --- EVENT WIRING ---
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedSize = parseInt(btn.dataset.size);
        });
      });
      document.getElementById('profile-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') doFetch();
      });
      document.getElementById('fetch-btn').addEventListener('click', doFetch);
      document.getElementById('copy-img-btn').addEventListener('click', copyImage);
      document.getElementById('download-btn').addEventListener('click', downloadImage);
    });
  </script>
</body>
</html>
